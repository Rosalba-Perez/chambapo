server {
    listen 80;
    server_name chambapo.co admin.chambapo.co api.chambapo.co;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.chambapo.co;
    ssl_certificate /etc/letsencrypt/live/api.chambapo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chambapo.co/privkey.pem;
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    server_name admin.chambapo.co;
    ssl_certificate /etc/letsencrypt/live/admin.chambapo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.chambapo.co/privkey.pem;
    location / { proxy_pass http://admin-web:80; }
}
